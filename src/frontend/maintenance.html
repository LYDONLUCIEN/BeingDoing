<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>系统维护中 · 寻路</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%);
      color: #1f2937;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      padding: 48px 36px;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #fef3c7;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d97706;
    }
    .icon svg { width: 32px; height: 32px; }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #111827;
    }
    .reason {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
    }
    .end-at {
      font-size: 14px;
      color: #374151;
      margin-bottom: 32px;
      padding: 8px 14px;
      background: #f3f4f6;
      border-radius: 8px;
      display: inline-block;
    }
    .end-at strong { color: #111827; font-weight: 600; }
    .channels {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #f3f4f6;
    }
    .channels a, .channels .wechat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      background: #f9fafb;
      color: #4b5563;
      text-decoration: none;
      font-size: 13px;
      transition: background 0.15s;
    }
    .channels a:hover, .channels .wechat:hover {
      background: #f3f4f6;
      color: #111827;
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #9ca3af;
    }
    /* 维护页面不应被缓存 */
    meta[data-mtime] { content: attr(data-mtime); }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>
      <h1>系统维护中</h1>
      <p class="reason">我们正在升级寻路，以提供更好的服务。维护原因：<span data-slot="reason">例行升级</span></p>
      <div class="end-at">预计恢复时间：<strong data-slot="end_at">稍后</strong></div>

      <div class="channels">
        <a href="https://soulhappylab.com" target="_blank" rel="noopener">博客</a>
        <a href="https://www.xiaohongshu.com" target="_blank" rel="noopener">小红书</a>
        <span class="wechat">微信群</span>
      </div>

      <p class="footer">感谢你的耐心等待 · 寻路 Xunlu</p>
    </div>
  </main>
</body>
</html>
