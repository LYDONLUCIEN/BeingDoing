# Nginx 配置：public 静态资源长缓存（2026-09-21 起）
# 用法：在 server 块中 include 此片段，位置放在 location / 之前即可
# （^~ 前缀匹配优先级高于 location /，相互之间无冲突）
#
# 背景：public/ 下文件名不带哈希，此前全部落入 location / 被强制
# no-store，导致每次刷新重下全部图片/字体（约 7.7MB）。
#
# 缓存口径：长缓存 + URL 版本号——前端引用这些资源时必须带 ?v=yyyymmdd
# 查询参数，更新资源时递增版本号即击穿缓存（见 next.config.js headers() 注释）。
# 忘记递增版本号时最坏情况：用户最长 30 天后拿到新资源。

location ^~ /assets/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Cache-Control;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
}

location ^~ /fonts/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Cache-Control;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
}
